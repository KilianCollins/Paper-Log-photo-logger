<!DOCTYPE html>
<html>
<head>
<base target="_top">
<style>
  :root{
    --paper:#F2F1EC; --card:#FFFFFF; --ink:#11161B; --muted:#5A646E;
    --rule:#D5D2C8; --blue:#123E5E; --green:#17603F; --red:#A32418;
    --mono: ui-monospace, "Roboto Mono", "DejaVu Sans Mono", Menlo, monospace;
    --sans: system-ui, "Roboto", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:var(--sans);
       font-size:16px; line-height:1.4; padding-bottom:44px;}
  .wrap{max-width:640px; margin:0 auto; padding:0 14px;}

  header{border-bottom:2px solid var(--ink); padding:16px 0 10px; margin-bottom:16px;}
  h1{font-size:19px; font-weight:700; letter-spacing:-.2px; margin:0;}
  .sub{font-family:var(--mono); font-size:11px; color:var(--muted);
       letter-spacing:.08em; text-transform:uppercase; margin-top:3px;}

  .resume{background:var(--ink); color:#fff; border-radius:3px; padding:13px 15px;
          margin-bottom:14px; display:flex; align-items:center; gap:12px; cursor:pointer;}
  .resume .k{font-family:var(--mono); font-size:10.5px; letter-spacing:.1em;
             text-transform:uppercase; opacity:.7;}
  .resume .v{font-weight:650; margin-top:2px;}
  .resume .go{margin-left:auto; font-size:22px; opacity:.8;}

  .card{background:var(--card); border:1px solid var(--rule); border-left:4px solid var(--red);
        border-radius:3px; padding:13px 14px; margin-bottom:9px; display:flex;
        align-items:center; gap:13px; cursor:pointer;}
  .card.done{border-left-color:var(--green);}
  .card:active{background:#F7F6F2;}
  .card .name{font-weight:650; font-size:16px; line-height:1.25;}
  .card .api{font-family:var(--mono); font-size:11.5px; color:var(--muted); margin-top:2px;}
  .card .grow{flex:1; min-width:0;}

  .gauge{width:30px; flex:none; display:flex; flex-direction:column; gap:3px;}
  .bed{height:11px; border:1px solid var(--rule); border-radius:1px;
       background:repeating-linear-gradient(-45deg,#EDEBE4 0 3px,#F7F6F2 3px 6px);}
  .bed.on{background:var(--green); border-color:var(--green);}
  .bed.opt{border-style:dashed; background:none; opacity:.75;}
  .bed.opt.on{background:var(--green); border-style:solid; opacity:1;}

  .back{font-family:var(--mono); font-size:12px; color:var(--blue); background:none;
        border:none; padding:10px 0; letter-spacing:.06em; text-transform:uppercase; cursor:pointer;}
  /* stays put at the top of the screen while you scroll the well page */
  .topbar{position:sticky; top:0; z-index:40; background:var(--paper);
          margin:0 -14px 2px; padding:0 14px; border-bottom:1px solid var(--rule);
          display:flex; align-items:center;}
  .topbar .back{padding:14px 0; font-size:12.5px; font-weight:600;}
  .topbar .who{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--muted);
               max-width:52%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .wellhead{border-bottom:1px solid var(--rule); padding-bottom:12px; margin-bottom:6px;}
  .wellhead h2{margin:0; font-size:21px; letter-spacing:-.3px;}
  .wellhead .meta{font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:4px;}

  /* slot status rows */
  .slot{position:relative; padding:14px 0 14px 22px;}
  .slot::before{content:""; position:absolute; left:5px; top:0; bottom:0; width:1px; background:var(--rule);}
  .slot::after{content:""; position:absolute; left:0; top:20px; width:11px; height:3px; background:var(--red);}
  .slot.on::after{background:var(--green);}
  .slot.opt::after{background:var(--rule);}
  .slot.opt.on::after{background:var(--green);}
  .slot:last-of-type::before{bottom:auto; height:20px;}
  .slabel{font-weight:650; font-size:16px;}
  .req{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase;
       color:var(--red); margin-left:7px;}
  .slot.on .req{color:var(--green);}
  .req.opt{color:var(--muted);}
  .shint{font-size:13px; color:var(--muted); margin-top:2px;}

  .addbox{border-top:1px solid var(--rule); margin-top:12px; padding-top:18px;}
  .addbox h3{margin:0 0 12px; font-size:15px; font-weight:650;}
  .pick{position:relative; display:flex; align-items:center; justify-content:center;
        width:100%; min-height:58px; background:var(--blue); color:#fff; margin-bottom:9px;
        border-radius:3px; font-size:16px; font-weight:650; cursor:pointer;
        overflow:hidden; user-select:none; text-align:center; padding:0 12px;}
  .pick:active{background:#0C2B42;}
  .pick.ghost{background:var(--card); color:var(--blue); border:2px solid var(--blue);}
  .pick.ghost:active{background:#EAF0F5;}
  .pick input{position:absolute; inset:0; width:100%; height:100%; opacity:0;
              cursor:pointer; font-size:0;}
  .alt{position:relative; display:block; text-align:center; margin-top:4px;
       font-size:13px; color:var(--muted); text-decoration:underline; padding:9px 0;}
  .alt input{position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; font-size:0;}

  .send{position:relative; display:flex; align-items:center; justify-content:center;
        width:100%; min-height:52px; margin:18px 0 8px; background:var(--card);
        color:var(--blue); border:2px solid var(--blue); border-radius:3px;
        font-size:16px; font-weight:650; font-family:var(--sans); cursor:pointer;}
  .note{font-size:13px; color:var(--muted); line-height:1.45;}

  /* ---------- review ---------- */
  .rev{background:var(--card); border:1px solid var(--rule); border-radius:3px;
       margin-bottom:14px; overflow:hidden;}
  .rev.dropped{opacity:.45;}
  .rev img{display:block; width:100%; max-height:340px; object-fit:contain;
           background:#22282E; cursor:zoom-in;}
  .rev .body{padding:12px 13px;}
  .rev .fn{font-family:var(--mono); font-size:11px; color:var(--muted);
           word-break:break-all; margin-bottom:10px;}
  .chips{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{flex:1 1 auto; min-width:92px; min-height:46px; display:flex; align-items:center;
        justify-content:center; text-align:center; padding:6px 8px; cursor:pointer;
        border:1.5px solid var(--rule); border-radius:3px; background:var(--paper);
        font-size:13.5px; font-weight:600; line-height:1.2;}
  .chip.sel{background:var(--blue); border-color:var(--blue); color:#fff;}
  .drop{display:block; width:100%; margin-top:9px; background:none; border:none;
        color:var(--red); font-size:13.5px; text-decoration:underline; padding:8px 0;
        font-family:var(--sans); cursor:pointer;}
  .zoomtip{font-size:12px; color:var(--muted); text-align:center; padding:7px 0 0;}

  .zoom{position:fixed; inset:0; background:#0B0F13; z-index:900; overflow:auto;
        -webkit-overflow-scrolling:touch;}
  .zoom img{display:block; max-width:none;}
  .zoom .x{position:fixed; top:14px; right:14px; z-index:901; min-height:46px; padding:0 18px;
           border-radius:3px; border:2px solid #fff; background:rgba(0,0,0,.6); color:#fff;
           font-size:15px; font-weight:650; font-family:var(--sans);}

  .veil{position:fixed; inset:0; background:var(--blue); color:#fff; z-index:999;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        text-align:center; padding:28px;}
  .veil .big{font-size:26px; font-weight:750; letter-spacing:-.4px; line-height:1.2;}
  .veil .small{font-family:var(--mono); font-size:12.5px; letter-spacing:.06em;
               opacity:.88; margin-top:14px; word-break:break-word;}
  .veil .warn{font-size:15px; font-weight:600; margin-top:26px;
              border-top:1px solid rgba(255,255,255,.3); padding-top:20px;}
  .bar{width:min(280px,80vw); height:7px; background:rgba(255,255,255,.25);
       border-radius:4px; margin-top:20px; overflow:hidden;}
  .bar i{display:block; height:100%; background:#fff; width:0;}
  .ring{width:56px; height:56px; border:5px solid rgba(255,255,255,.28);
        border-top-color:#fff; border-radius:50%; margin-bottom:26px;
        animation:spin 900ms linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.ring{animation-duration:2.4s}}
  .veil.ok{background:var(--green);} .veil.bad{background:var(--red);}
  .veil button{margin-top:26px; min-height:52px; padding:0 26px; border-radius:3px;
               border:2px solid #fff; background:transparent; color:#fff;
               font-size:16px; font-weight:650; font-family:var(--sans);}

  .toast{position:fixed; left:14px; right:14px; bottom:16px; max-width:612px; margin:0 auto;
         background:var(--ink); color:#fff; padding:13px 15px; border-radius:3px;
         font-size:14px; z-index:60;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Well Photo Log</h1>
    <div class="sub" id="tally">Connecting to Drive</div>
  </header>
  <div id="view"></div>
</div>

<script>
var MAX_EDGE = 2000, QUALITY = 0.82;
var WELLS = [], SLOTS = [], STATUS = {}, ROOT = '', LAST = null;
var PENDING = [], PENDING_WELL = null;

function el(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function wellById(id){ for(var i=0;i<WELLS.length;i++) if(WELLS[i].id===id) return WELLS[i]; return null; }
function slotById(id){ for(var i=0;i<SLOTS.length;i++) if(SLOTS[i].id===id) return SLOTS[i]; return null; }

function veil(html, cls){
  hideVeil();
  var v = document.createElement('div');
  v.className = 'veil' + (cls ? ' ' + cls : '');
  v.id = 'veil'; v.innerHTML = html;
  document.body.appendChild(v);
  return v;
}
function hideVeil(){ var v = el('veil'); if(v) v.remove(); }
function toast(msg, ms){
  var old = el('toast'); if(old) old.remove();
  var t = document.createElement('div'); t.id='toast'; t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.remove(); }, ms || 4200);
}

function isReq(sl){ return sl.required !== false; }
function count(w,s){ return (STATUS[w] && STATUS[w][s]) || 0; }
function slotDone(w,s){ return count(w,s) > 0; }
function wellDone(w){
  for(var i=0;i<SLOTS.length;i++)
    if(isReq(SLOTS[i]) && !slotDone(w, SLOTS[i].id)) return false;
  return true;
}
function firstGap(wid){
  for(var i=0;i<SLOTS.length;i++)
    if(isReq(SLOTS[i]) && !slotDone(wid, SLOTS[i].id)) return SLOTS[i].id;
  for(var j=0;j<SLOTS.length;j++)
    if(!slotDone(wid, SLOTS[j].id)) return SLOTS[j].id;
  return SLOTS[0].id;
}
function barLegend(){
  var names = [];
  for(var i=0;i<SLOTS.length;i++)
    names.push(SLOTS[i].label.toLowerCase() + (isReq(SLOTS[i]) ? '' : ' (optional)'));
  return names.join(', ');
}
function tally(){
  var d = 0;
  for(var i=0;i<WELLS.length;i++) if(wellDone(WELLS[i].id)) d++;
  el('tally').textContent = d + ' of ' + WELLS.length + ' wells complete · ' + ROOT;
}

/* ================= list ================= */
function renderList(){
  var html = '';
  if(LAST && wellById(LAST) && !wellDone(LAST)){
    html += '<div class="resume" id="resume"><div>' +
              '<div class="k">Pick up where you left off</div>' +
              '<div class="v">' + esc(wellById(LAST).name) + '</div></div>' +
              '<div class="go">&rarr;</div></div>';
  }
  for(var i=0;i<WELLS.length;i++){
    var w = WELLS[i], beds = '';
    for(var s=0;s<SLOTS.length;s++)
      beds += '<div class="bed ' + (isReq(SLOTS[s]) ? '' : 'opt ') +
              (slotDone(w.id, SLOTS[s].id)?'on':'') + '"></div>';
    html += '<div class="card ' + (wellDone(w.id)?'done':'') + '" data-well="' + esc(w.id) + '">' +
              '<div class="grow"><div class="name">' + esc(w.name) + '</div>' +
              '<div class="api">' + esc(w.api) + (w.note ? ' · ' + esc(w.note) : '') + '</div></div>' +
              '<div class="gauge">' + beds + '</div></div>';
  }
  el('view').innerHTML = html +
    '<button class="send" id="refresh">Refresh from Drive</button>' +
    '<p class="note">Bars are ' + esc(barLegend()) + ', top to bottom. A dashed bar is ' +
    'optional and does not hold a well back from counting as complete. Nothing is kept on ' +
    'this phone — it all lives in your Drive folder &ldquo;' + esc(ROOT) + '&rdquo;.</p>';

  if(el('resume')) el('resume').addEventListener('click', function(){ renderWell(LAST); });
  var cards = document.querySelectorAll('[data-well]');
  for(var c=0;c<cards.length;c++){
    (function(n){ n.addEventListener('click', function(){ renderWell(n.getAttribute('data-well')); }); })(cards[c]);
  }
  el('refresh').addEventListener('click', refresh);
  tally();
}

function refresh(){
  veil('<div class="ring"></div><div class="big">Reading Drive&hellip;</div>');
  google.script.run
    .withSuccessHandler(function(st){ STATUS = st; hideVeil(); renderList(); })
    .withFailureHandler(function(e){ hideVeil(); toast('Could not reach Drive: ' + e.message, 6000); })
    .getStatus();
}

/* ================= well ================= */
function renderWell(wid){
  var w = wellById(wid);
  if(!w){ renderList(); return; }
  LAST = wid;
  google.script.run.setLastWell(wid);

  var slots = '';
  for(var s=0;s<SLOTS.length;s++){
    var sl = SLOTS[s], n = count(wid, sl.id), opt = !isReq(sl);
    slots += '<div class="slot ' + (opt?'opt ':'') + (n?'on':'') + '">' +
      '<div class="slabel">' + esc(sl.label) +
        '<span class="req' + (opt && !n ? ' opt' : '') + '">' +
        (n ? n + ' in Drive' : (opt ? 'optional' : 'required')) + '</span></div>' +
      '<div class="shint">' + esc(sl.hint) + '</div></div>';
  }

  el('view').innerHTML =
    '<div class="topbar"><button class="back" id="back">&larr; All wells</button>' +
    '<div class="who">' + esc(w.name) + '</div></div>' +
    '<div class="wellhead"><h2>' + esc(w.name) + '</h2>' +
    '<div class="meta">' + esc(w.api) + (w.note ? ' · ' + esc(w.note) : '') + '</div></div>' +
    slots +
    '<div class="addbox"><h3>Add photos to this well</h3>' +
      '<label class="pick">Photos &amp; gallery' +
        '<input type="file" accept="image/*" multiple id="srcGallery"></label>' +
      '<label class="pick ghost">Files, Drive or Google Photos' +
        '<input type="file" multiple id="srcFiles"></label>' +
      '<label class="alt">or open the camera here (Android may reload the page)' +
        '<input type="file" accept="image/*" capture="environment" id="srcCam"></label>' +
    '</div>' +
    '<button class="send" id="open">Open this well’s Drive folder</button>' +
    '<p class="note">You will see every photo and choose its slot before anything uploads.</p>' +
    '<button class="send" id="backbtm" style="margin-top:22px">&larr; Back to all wells</button>';

  el('back').addEventListener('click', renderList);
  el('backbtm').addEventListener('click', renderList);
  el('open').addEventListener('click', function(){ openFolder(wid); });

  ['srcGallery','srcFiles','srcCam'].forEach(function(id){
    el(id).addEventListener('change', function(){
      var files = [];
      if(this.files) for(var f=0; f<this.files.length; f++) files.push(this.files[f]);
      this.value = '';
      if(!files.length){ toast('Nothing selected.'); return; }
      prepare(wid, files);
    });
  });
}

function openFolder(wid){
  google.script.run
    .withSuccessHandler(function(url){
      if(url) window.open(url, '_blank');
      else toast('That folder does not exist yet — add a photo first.');
    })
    .withFailureHandler(function(e){ toast('Could not look that up: ' + e.message); })
    .folderLink(wid);
}

/* ================= prepare then review ================= */
function prepare(wid, files){
  PENDING = []; PENDING_WELL = wid;
  var i = 0, rejected = [];
  var deflt = firstGap(wid);

  function step(){
    if(i >= files.length){
      if(rejected.length) toast('Skipped: ' + rejected.join(', '), 6500);
      if(!PENDING.length){ hideVeil(); renderWell(wid); return; }
      hideVeil(); renderReview();
      return;
    }
    veil('<div class="ring"></div><div class="big">Preparing&hellip;</div>' +
         '<div class="small">photo ' + (i+1) + ' of ' + files.length + '</div>' +
         '<div class="bar"><i style="width:' + Math.round(i/files.length*100) + '%"></i></div>');
    var f = files[i];
    shrink(f).then(function(b64){
      PENDING.push({ b64:b64, name:(f.name||('photo-'+(i+1))), slot:deflt, dropped:false });
      i++; step();
    }).catch(function(){
      rejected.push(f.name || ('photo ' + (i+1)));
      i++; step();
    });
  }
  step();
}

function renderReview(){
  var w = wellById(PENDING_WELL);
  var live = PENDING.filter(function(p){ return !p.dropped; }).length;
  var html =
    '<div class="topbar"><button class="back" id="cancel">&larr; Cancel, upload nothing</button>' +
    '<div class="who">' + esc(w.name) + '</div></div>' +
    '<div class="wellhead"><h2>Check before uploading</h2>' +
    '<div class="meta">' + esc(w.name) + ' · ' + PENDING.length + ' selected</div></div>' +
    '<p class="note" style="margin:12px 0 16px">This is exactly what will land in Drive, at the ' +
    'size it will be stored. Tap an image to zoom in and check the fine print.</p>';

  for(var i=0;i<PENDING.length;i++){
    var p = PENDING[i], chips = '';
    for(var s=0;s<SLOTS.length;s++){
      chips += '<div class="chip ' + (p.slot===SLOTS[s].id ? 'sel':'') + '" ' +
               'data-i="' + i + '" data-slot="' + esc(SLOTS[s].id) + '">' +
               esc(SLOTS[s].label) + '</div>';
    }
    var kb = Math.round(p.b64.length * 0.75 / 1024);
    html += '<div class="rev ' + (p.dropped?'dropped':'') + '">' +
      '<img src="data:image/jpeg;base64,' + p.b64 + '" data-zoom="' + i + '" alt="">' +
      '<div class="zoomtip">Tap image to zoom</div>' +
      '<div class="body">' +
        '<div class="fn">' + esc(p.name) + ' · ' + kb + ' KB</div>' +
        (p.dropped ? '' : '<div class="chips">' + chips + '</div>') +
        '<button class="drop" data-drop="' + i + '">' +
          (p.dropped ? 'Put this one back' : 'Do not upload this one') + '</button>' +
      '</div></div>';
  }

  html += '<button class="send" id="go" style="background:var(--blue);color:#fff;border-color:var(--blue)">' +
          (live ? 'Upload ' + live + ' photo' + (live>1?'s':'') + ' to Drive' : 'Nothing selected') +
          '</button>';

  el('view').innerHTML = html;
  window.scrollTo(0,0);

  el('cancel').addEventListener('click', function(){
    PENDING = []; renderWell(PENDING_WELL);
  });

  var chipEls = el('view').querySelectorAll('.chip');
  for(var c=0;c<chipEls.length;c++){
    (function(n){
      n.addEventListener('click', function(){
        PENDING[+n.getAttribute('data-i')].slot = n.getAttribute('data-slot');
        renderReview();
      });
    })(chipEls[c]);
  }
  var dropEls = el('view').querySelectorAll('[data-drop]');
  for(var d=0;d<dropEls.length;d++){
    (function(n){
      n.addEventListener('click', function(){
        var p = PENDING[+n.getAttribute('data-drop')];
        p.dropped = !p.dropped;
        renderReview();
      });
    })(dropEls[d]);
  }
  var imgs = el('view').querySelectorAll('[data-zoom]');
  for(var z=0;z<imgs.length;z++){
    (function(n){
      n.addEventListener('click', function(){ openZoom(PENDING[+n.getAttribute('data-zoom')]); });
    })(imgs[z]);
  }
  el('go').addEventListener('click', function(){
    var keep = PENDING.filter(function(p){ return !p.dropped; });
    if(!keep.length){ toast('Every photo is marked not to upload.'); return; }
    runQueue(PENDING_WELL, keep);
  });
}

function openZoom(p){
  var z = document.createElement('div');
  z.className = 'zoom'; z.id = 'zoom';
  z.innerHTML = '<button class="x" id="zx">Close</button>' +
                '<img src="data:image/jpeg;base64,' + p.b64 + '" alt="">';
  document.body.appendChild(z);
  el('zx').addEventListener('click', function(){ z.remove(); });
}

/* ================= upload ================= */
function runQueue(wid, items){
  var total = items.length, done = 0, failed = [];

  function paint(stage){
    veil('<div class="ring"></div>' +
      '<div class="big">Uploading&hellip;<br>Please wait</div>' +
      '<div class="small">photo ' + Math.min(done+1,total) + ' of ' + total + ' · ' + esc(stage) + '</div>' +
      '<div class="bar"><i style="width:' + Math.round(done/total*100) + '%"></i></div>' +
      '<div class="warn">Do not close this page<br>or lock your phone</div>');
  }

  function next(){
    if(done >= total){ finish(); return; }
    var it = items[done];
    paint(slotById(it.slot).label);
    google.script.run
      .withSuccessHandler(function(res){
        if(!STATUS[wid]) STATUS[wid] = {};
        STATUS[wid][it.slot] = res.count;
        done++; next();
      })
      .withFailureHandler(function(err){
        failed.push(it.name + ' — ' + (err && err.message ? err.message : 'unknown'));
        done++; next();
      })
      .uploadPhoto({ wellId: wid, slotId: it.slot, data: it.b64 });
  }

  function finish(){
    PENDING = [];
    var ok = total - failed.length;
    if(!failed.length){
      veil('<div class="big">' + ok + ' saved to Drive</div>' +
           '<div class="small">' + esc(wellById(wid).name) + '</div>' +
           '<button id="vok">Done</button>', 'ok');
      el('vok').addEventListener('click', function(){ hideVeil(); renderWell(wid); });
    } else {
      veil('<div class="big">' + ok + ' saved, ' + failed.length + ' failed</div>' +
           '<div class="small">' + esc(failed.join('  •  ')) + '</div>' +
           '<button id="vbad">Back</button>', failed.length === total ? 'bad' : '');
      el('vbad').addEventListener('click', function(){ hideVeil(); renderWell(wid); });
    }
  }
  next();
}

/* ================= image resizing ================= */
function shrink(file){
  if(typeof createImageBitmap === 'function'){
    return createImageBitmap(file, { imageOrientation:'from-image' })
      .then(function(bmp){ return draw(bmp, bmp.width, bmp.height, bmp); })
      .catch(function(){ return viaImg(file); });
  }
  return viaImg(file);
}
function viaImg(file){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try { res(draw(img, img.naturalWidth, img.naturalHeight, null)); }
      catch(e){ rej(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error('not an image the browser can open')); };
    img.src = url;
  });
}
function draw(src, w, h, closeable){
  var scale = Math.min(1, MAX_EDGE / Math.max(w, h));
  var cw = Math.round(w * scale), ch = Math.round(h * scale);
  var c = document.createElement('canvas');
  c.width = cw; c.height = ch;
  c.getContext('2d').drawImage(src, 0, 0, cw, ch);
  if(closeable && closeable.close) closeable.close();
  var out = c.toDataURL('image/jpeg', QUALITY).split(',')[1];
  c.width = 0; c.height = 0;
  return out;
}

/* ================= boot ================= */
veil('<div class="ring"></div><div class="big">Starting up&hellip;</div>');
google.script.run
  .withSuccessHandler(function(cfg){
    WELLS = cfg.wells; SLOTS = cfg.slots; STATUS = cfg.status;
    ROOT = cfg.rootName; LAST = cfg.lastWell || null;
    hideVeil(); renderList();
  })
  .withFailureHandler(function(e){
    veil('<div class="big">Could not start</div><div class="small">' +
         esc(e && e.message ? e.message : 'Unknown error') + '</div>' +
         '<button onclick="location.reload()">Reload</button>', 'bad');
  })
  .boot();
